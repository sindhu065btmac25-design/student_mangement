<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-lg p-4">

                    <h2 class="text-center text-primary mb-4">
                        ➕ Add Student
                    </h2>

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text" name="name" class="form-control" placeholder="Enter Student Name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Course
                            </label>

                            <input type="text" name="course" class="form-control" placeholder="Enter Course" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Semester
                            </label>

                            <input type="text" name="semester" class="form-control" placeholder="Enter Semester"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email" name="email" class="form-control" placeholder="Enter Email" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Student Photo
                            </label>

                            <input type="file" name="photo" class="form-control" accept="image/*" required>

                        </div>

                        <button type="submit" class="btn btn-primary w-100">

                            Add Student

                        </button>

                    </form>

                    <br>

                    <a href="/dashboard" class="btn btn-secondary">
                        ← Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
