<!DOCTYPE html>
<html>

<head>

    <title>Audit Logs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

    <div class="container-fluid px-5 mt-5">

        <div class="card shadow-lg p-4">

            <h2 class="text-center text-primary mb-4">
                📜 Audit Logs
            </h2>

            <form method="GET" class="row g-3 mb-4">

                <div class="col-md-4">
                    <input type="text" name="username" class="form-control" placeholder="Search Username">
                </div>

                <div class="col-md-4">
                    <input type="text" name="action" class="form-control" placeholder="Search Action">
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        🔍 Search
                    </button>
                </div>

                <div class="col-md-2">
                    <a href="/export_logs?username={{ request.args.get('username','') }}&action={{ request.args.get('action','') }}"
                        class="btn btn-success w-100">
                        📥 Export
                    </a>
                </div>

            </form>

            <div class="table-responsive">

                <table class="table table-bordered table-hover table-striped align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Username</th>
                            <th>Action</th>
                            <th>Time</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for log in logs %}

                        <tr>

                            <td>{{ log[0] }}</td>
                            <td>{{ log[1] }}</td>
                            <td>{{ log[2] }}</td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

            <a href="/export_logs">
                <button class="btn btn-success">
                    ⬇ Export CSV
                </button>
            </a>

            <br><br>

            <a href="/" class="btn btn-secondary mt-3">
                ← Back
            </a>

        </div>

    </div>

</body>

</html>
