<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-lg p-4">

                    <h2 class="text-center text-warning mb-4">
                        ✏️ Edit Student
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text" name="name" value="{{ student[1] }}" class="form-control" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Course
                            </label>

                            <input type="text" name="course" value="{{ student[2] }}" class="form-control" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Semester
                            </label>

                            <input type="text" name="semester" value="{{ student[3] }}" class="form-control" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email" name="email" value="{{ student[4] }}" class="form-control" required>

                        </div>

                        <button type="submit" class="btn btn-warning w-100">

                            Update Student

                        </button>

                    </form>

                    <br>

                    <a href="/view_student" class="btn btn-secondary">
                        ← Back
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
